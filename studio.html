<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Doodle Character Customizer Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { font-family:'Nunito',sans-serif; background:#FDF6EE; margin:0; padding:0; }
.fredoka { font-family:'Fredoka One',cursive; }
.sk { border:2px solid #4A3E3D; border-radius:12px; box-shadow:3px 3px 0 #4A3E3D; }
.sk-sm { border:2px solid #4A3E3D; border-radius:8px; box-shadow:2px 2px 0 #4A3E3D; }
#toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#4A3E3D; color:white; padding:10px 22px; border-radius:20px;
  font-size:13px; font-weight:700; opacity:0; transition:opacity .3s;
  pointer-events:none; z-index:9999; white-space:nowrap;
}
#toast.show { opacity:1; }
.crop-wrap { position:relative; }
#crop-img-c { display:block; }
#crop-sel-c { position:absolute; top:0; left:0; cursor:crosshair; }
.pocket-item {
  position:relative; border:2px solid #E9D5FF; border-radius:8px;
  background:white; padding:3px; cursor:grab; transition:border-color .2s;
  display:inline-block;
}
.pocket-item:hover { border-color:#A855F7; }
.pocket-item .x-btn {
  position:absolute; top:-7px; right:-7px; width:18px; height:18px;
  background:#EF4444; border-radius:50%; color:white; font-size:11px; font-weight:900;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  opacity:0; transition:opacity .2s; line-height:1; border:1.5px solid white;
}
.pocket-item:hover .x-btn { opacity:1; }
.prod-tab {
  padding:5px 11px; border-radius:8px; font-size:11px; font-weight:800;
  cursor:pointer; border:2px solid #4A3E3D; white-space:nowrap;
  transition:all .15s;
}
.prod-tab.on { background:#4A3E3D; color:white; }
.prod-tab:not(.on) { background:white; color:#4A3E3D; }
.swatch {
  width:22px; height:22px; border:2px solid #4A3E3D; border-radius:5px;
  cursor:pointer; box-shadow:1px 1px 0 #4A3E3D; flex-shrink:0;
}
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:#F5F0E8; }
::-webkit-scrollbar-thumb { background:#C4B5A0; border-radius:3px; }
</style>
</head>
<body style="min-height:100vh; padding:12px;">

<div id="toast"></div>

<!-- Header -->
<div style="text-align:center; margin-bottom:10px;">
  <h1 class="fredoka" style="font-size:26px; color:#4A3E3D; margin:0;">
    🎨 AI Doodle Character Customizer Studio
  </h1>
  <p style="font-size:12px; color:#7C6F64; margin:2px 0 0;">나만의 굿즈를 만들어보세요!</p>
</div>

<!-- 3-panel layout -->
<div style="display:grid; grid-template-columns:290px 1fr 190px; gap:10px; height:calc(100vh - 90px); max-width:1300px; margin:0 auto;">

  <!-- ===== PANEL 1: CROPPER ===== -->
  <div class="sk" style="background:#FFF8F0; padding:12px; display:flex; flex-direction:column; gap:8px; overflow:hidden; min-height:0;">
    <div class="fredoka" style="font-size:15px; color:#4A3E3D;">✂️ 스티커 크로퍼</div>

    <!-- Upload -->
    <div id="upload-area" class="sk-sm"
         style="height:70px; border-style:dashed; background:white; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; color:#9CA3AF; font-size:11px; font-weight:700;"
         onclick="document.getElementById('file-in').click()"
         ondragover="event.preventDefault()"
         ondrop="handleDrop(event)">
      <span style="font-size:22px;">📁</span>
      <span>이미지 드래그 or 클릭</span>
    </div>
    <input type="file" id="file-in" accept="image/*" style="display:none" onchange="loadFile(event)">

    <!-- Crop mode -->
    <div style="display:flex; gap:6px;">
      <button id="btn-rect" class="sk-sm" style="flex:1; font-size:11px; font-weight:800; padding:5px 4px; background:#E9D5FF; color:#4A3E3D; cursor:pointer;"
              onclick="setCropMode('rect')">⬜ 사각 선택</button>
      <button id="btn-lasso" class="sk-sm" style="flex:1; font-size:11px; font-weight:800; padding:5px 4px; background:white; color:#4A3E3D; cursor:pointer;"
              onclick="setCropMode('lasso')">🌀 올가미</button>
    </div>

    <!-- Canvas area -->
    <div class="sk-sm crop-wrap" style="flex:1; background:#F3F4F6; overflow:hidden; min-height:160px; position:relative;">
      <canvas id="crop-img-c"></canvas>
      <canvas id="crop-sel-c"></canvas>
    </div>

    <!-- Presets -->
    <div style="display:flex; gap:4px;">
      <button class="sk-sm" style="flex:1; font-size:10px; font-weight:800; padding:4px 2px; background:#FDE2E4; color:#4A3E3D; cursor:pointer;" onclick="preset('top')">상단</button>
      <button class="sk-sm" style="flex:1; font-size:10px; font-weight:800; padding:4px 2px; background:#FDE2E4; color:#4A3E3D; cursor:pointer;" onclick="preset('mid')">중단</button>
      <button class="sk-sm" style="flex:1; font-size:10px; font-weight:800; padding:4px 2px; background:#FDE2E4; color:#4A3E3D; cursor:pointer;" onclick="preset('bot')">하단</button>
      <button class="sk-sm" style="flex:1; font-size:10px; font-weight:800; padding:4px 2px; background:#FDE2E4; color:#4A3E3D; cursor:pointer;" onclick="preset('all')">전체</button>
    </div>

    <!-- Nukkii toggle -->
    <div style="display:flex; align-items:center; justify-content:space-between; padding:0 2px;">
      <span style="font-size:12px; font-weight:800; color:#4A3E3D;">누끼 따기</span>
      <label style="position:relative; display:inline-block; width:40px; height:22px; cursor:pointer;">
        <input type="checkbox" id="nukkii-cb" style="opacity:0;width:0;height:0;" onchange="toggleNukkii(this.checked)">
        <span id="nukkii-track" style="position:absolute;inset:0;background:#D1D5DB;border-radius:20px;border:1.5px solid #4A3E3D;transition:.3s;">
          <span id="nukkii-knob" style="position:absolute;width:16px;height:16px;background:white;border-radius:50%;top:1px;left:1px;border:1.5px solid #4A3E3D;transition:.3s;"></span>
        </span>
      </label>
    </div>

    <!-- Add to pocket -->
    <button class="sk-sm" style="background:#A855F7; color:white; border-color:#7E22CE; font-size:13px; font-weight:800; padding:8px; cursor:pointer; width:100%;"
            onclick="addToPocket()">+ 스티커 추가하기</button>
  </div>

  <!-- ===== PANEL 2: GOODS PREVIEW ===== -->
  <div class="sk" style="background:#FFF8F0; padding:12px; display:flex; flex-direction:column; gap:8px; overflow:hidden; min-height:0; min-width:0;">
    <div class="fredoka" style="font-size:15px; color:#4A3E3D;">🎁 굿즈 프리뷰</div>

    <!-- Product tabs -->
    <div style="display:flex; gap:5px; flex-wrap:wrap;">
      <button class="prod-tab on" id="tab-phone"   onclick="selProd('phone')">📱 폰케이스</button>
      <button class="prod-tab"    id="tab-griptok" onclick="selProd('griptok')">🔘 그립톡</button>
      <button class="prod-tab"    id="tab-mug"     onclick="selProd('mug')">☕ 머그컵</button>
      <button class="prod-tab"    id="tab-keyring" onclick="selProd('keyring')">🔑 키링</button>
      <button class="prod-tab"    id="tab-tshirt"  onclick="selProd('tshirt')">👕 티셔츠</button>
    </div>

    <!-- Canvas + sidebar -->
    <div style="display:flex; gap:10px; flex:1; min-height:0;">
      <!-- Canvas column -->
      <div style="display:flex; flex-direction:column; flex:1; gap:6px; min-height:0; min-width:0;">
        <div class="sk-sm" id="goods-wrap"
             style="flex:1; background:#E5E7EB; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;">
          <canvas id="goods-c" style="display:block; cursor:default;"></canvas>
        </div>

        <!-- Sticker controls -->
        <div id="st-ctrl" style="display:none; align-items:center; gap:8px;">
          <span style="font-size:11px; font-weight:800; color:#4A3E3D; white-space:nowrap;">크기</span>
          <input type="range" id="sz-slider" min="8" max="100" value="40"
                 style="flex:1; accent-color:#A855F7;" oninput="resizeSt(this.value)">
          <button class="sk-sm" style="background:#EF4444; color:white; border-color:#DC2626; font-size:11px; font-weight:800; padding:4px 10px; cursor:pointer;" onclick="deleteSt()">🗑 삭제</button>
        </div>

        <!-- Guide toggle row -->
        <div style="display:flex; align-items:center; justify-content:space-between; padding:0 2px;">
          <span style="font-size:11px; font-weight:800; color:#4A3E3D;">인쇄 가이드</span>
          <label style="position:relative; display:inline-block; width:40px; height:22px; cursor:pointer;">
            <input type="checkbox" id="guide-cb" style="opacity:0;width:0;height:0;" onchange="toggleGuide(this.checked)" checked>
            <span id="guide-track" style="position:absolute;inset:0;background:#86EFAC;border-radius:20px;border:1.5px solid #4A3E3D;transition:.3s;">
              <span id="guide-knob" style="position:absolute;width:16px;height:16px;background:white;border-radius:50%;top:1px;left:21px;border:1.5px solid #4A3E3D;transition:.3s;"></span>
            </span>
          </label>
        </div>

        <!-- Export -->
        <button class="sk-sm" style="background:#10B981; color:white; border-color:#059669; font-size:13px; font-weight:800; padding:7px; cursor:pointer;" onclick="exportPNG()">💾 PNG 내보내기</button>
      </div>

      <!-- Color + info sidebar -->
      <div style="width:110px; display:flex; flex-direction:column; gap:6px;">
        <div style="font-size:11px; font-weight:800; color:#4A3E3D;">베이스 색상</div>
        <div id="swatches" style="display:flex; flex-wrap:wrap; gap:4px;"></div>
        <input type="color" id="custom-col" value="#FDE2E4"
               class="sk-sm" style="width:100%; height:30px; padding:2px; cursor:pointer;" oninput="setColor(this.value)">

        <div style="margin-top:auto; padding-top:6px;">
          <div style="font-size:11px; font-weight:800; color:#4A3E3D; margin-bottom:3px;">배치된 스티커</div>
          <div id="st-count" style="font-size:11px; color:#7C6F64;">0개</div>
        </div>
        <button class="sk-sm" style="background:#FEE2E2; color:#DC2626; border-color:#EF4444; font-size:11px; font-weight:800; padding:5px; cursor:pointer;" onclick="clearAll()">전체 삭제</button>
      </div>
    </div>
  </div>

  <!-- ===== PANEL 3: POCKET ===== -->
  <div class="sk" style="background:#FFF8F0; padding:12px; display:flex; flex-direction:column; gap:8px; overflow:hidden; min-height:0;">
    <div class="fredoka" style="font-size:15px; color:#4A3E3D;">👜 스티커 포켓</div>
    <p style="font-size:11px; color:#7C6F64; margin:0;">드래그해서 굿즈에 붙이세요</p>

    <div id="pocket-grid" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px;">
      <div id="pocket-empty" style="text-align:center; font-size:11px; color:#9CA3AF; padding:20px 0;">
        아직 스티커가 없어요<br>✂️ 크로퍼에서 추가하세요
      </div>
    </div>

    <button class="sk-sm" style="background:#DBEAFE; color:#1D4ED8; border-color:#3B82F6; font-size:11px; font-weight:800; padding:6px; cursor:pointer;" onclick="dlAll()">⬇️ 전체 다운로드</button>
  </div>

</div>

<script>
// ── STATE ──────────────────────────────────────────────────────
var S = {
  src: null,
  cropMode: 'rect',
  nukkii: false,
  showGuide: true,
  // rect crop
  rStart: null, rEnd: null, rDrag: false,
  // lasso
  lPts: [], lDrag: false, lAnimId: null, lOff: 0,
  cropScale: 1,
  // pocket
  pocket: [], pNextId: 0,
  pDragIdx: null,
  // goods
  prod: 'phone',
  color: '#FDE2E4',
  stickers: [], sNextId: 0,
  selId: null,
  gDrag: false, gDragId: null, gDx: 0, gDy: 0,
};

var PROD = {
  phone:   {cw:210, ch:370, ax:16, ay:52, aw:178, ah:274, name:'폰케이스',   hole:false},
  griptok: {cw:250, ch:250, ax:25, ay:25, aw:200, ah:200, name:'그립톡',     hole:false},
  mug:     {cw:280, ch:270, ax:22, ay:48, aw:200, ah:158, name:'머그컵',     hole:false},
  keyring: {cw:210, ch:270, ax:18, ay:48, aw:174, ah:204, name:'아크릴 키링',hole:true },
  tshirt:  {cw:290, ch:290, ax:72, ay:88, aw:146, ah:136, name:'티셔츠',    hole:false},
};

var PALETTE = ['#FDE2E4','#FCE7C8','#FEFEC8','#C8F7C5','#C8E6F7','#E8C8F7','#F7C8E8','#F5F5DC','#D4F1F9','#FFFFFF'];

// ── TOAST ─────────────────────────────────────────────────────
var _tt = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (_tt) clearTimeout(_tt);
  _tt = setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

// ── INIT ──────────────────────────────────────────────────────
function init() {
  // swatches
  var sw = document.getElementById('swatches');
  PALETTE.forEach(function(c) {
    var d = document.createElement('div');
    d.className = 'swatch';
    d.style.background = c;
    d.onclick = function(){ setColor(c); };
    sw.appendChild(d);
  });

  setupCropCanvas();
  setupGoodsCanvas();
  renderGoods();
}

// ── FILE LOAD ─────────────────────────────────────────────────
function handleDrop(e) {
  e.preventDefault();
  var f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) doLoad(f);
}
function loadFile(e) { doLoad(e.target.files[0]); }
function doLoad(file) {
  var url = URL.createObjectURL(file);
  var img = new Image();
  img.onload = function() {
    S.src = img;
    drawCropImg();
    clearSel();
    toast('이미지 로드 완료!');
  };
  img.src = url;
}

// ── CROP CANVAS ───────────────────────────────────────────────
function setupCropCanvas() {
  var sel = document.getElementById('crop-sel-c');
  sel.addEventListener('mousedown', cropDown);
  sel.addEventListener('mousemove', cropMove);
  sel.addEventListener('mouseup',   cropUp);
  sel.addEventListener('mouseleave',cropUp);
  sel.addEventListener('touchstart', function(e){ e.preventDefault(); cropDown(t2m(e)); }, {passive:false});
  sel.addEventListener('touchmove',  function(e){ e.preventDefault(); cropMove(t2m(e)); }, {passive:false});
  sel.addEventListener('touchend',   function(e){ e.preventDefault(); cropUp(); }, {passive:false});
}

function t2m(e) {
  var t = e.touches[0] || e.changedTouches[0];
  return {clientX: t.clientX, clientY: t.clientY};
}

function drawCropImg() {
  if (!S.src) return;
  var wrap = document.querySelector('.crop-wrap');
  var maxW = wrap.clientWidth - 4;
  var maxH = Math.max(wrap.clientHeight - 4, 160);
  var sc = Math.min(maxW / S.src.width, maxH / S.src.height, 1);
  var dw = Math.round(S.src.width * sc);
  var dh = Math.round(S.src.height * sc);
  S.cropScale = sc;

  var ic = document.getElementById('crop-img-c');
  var sc2 = document.getElementById('crop-sel-c');
  ic.width = dw; ic.height = dh;
  sc2.width = dw; sc2.height = dh;
  ic.getContext('2d').drawImage(S.src, 0, 0, dw, dh);
}

function clearSel() {
  var c = document.getElementById('crop-sel-c');
  if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
  S.rStart = null; S.rEnd = null; S.lPts = [];
}

function cPos(e, id) {
  var c = document.getElementById(id);
  var r = c.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (c.width / r.width),
    y: (e.clientY - r.top) * (c.height / r.height),
  };
}

function cropDown(e) {
  if (!S.src) return;
  var p = cPos(e, 'crop-sel-c');
  if (S.cropMode === 'rect') { S.rStart = p; S.rEnd = p; S.rDrag = true; }
  else { S.lPts = [p]; S.lDrag = true; startLassoAnim(); }
}
function cropMove(e) {
  if (!S.src) return;
  var p = cPos(e, 'crop-sel-c');
  if (S.cropMode === 'rect' && S.rDrag) { S.rEnd = p; drawRectSel(); }
  else if (S.cropMode === 'lasso' && S.lDrag) { S.lPts.push(p); drawLassoSel(); }
}
function cropUp() { S.rDrag = false; S.lDrag = false; }

function drawRectSel() {
  var c = document.getElementById('crop-sel-c');
  var ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  if (!S.rStart || !S.rEnd) return;
  var x = Math.min(S.rStart.x, S.rEnd.x), y = Math.min(S.rStart.y, S.rEnd.y);
  var w = Math.abs(S.rEnd.x - S.rStart.x), h = Math.abs(S.rEnd.y - S.rStart.y);
  ctx.fillStyle = 'rgba(168,85,247,.15)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#A855F7'; ctx.lineWidth = 2;
  ctx.setLineDash([5,3]); ctx.strokeRect(x,y,w,h); ctx.setLineDash([]);
}

function drawLassoSel() {
  var c = document.getElementById('crop-sel-c');
  var ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  if (S.lPts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(S.lPts[0].x, S.lPts[0].y);
  S.lPts.forEach(function(p){ ctx.lineTo(p.x, p.y); });
  if (!S.lDrag) ctx.closePath();
  ctx.fillStyle = 'rgba(249,168,212,.2)'; ctx.fill();
  ctx.strokeStyle = '#EC4899'; ctx.lineWidth = 2;
  ctx.setLineDash([6,3]); ctx.lineDashOffset = -S.lOff;
  ctx.stroke(); ctx.setLineDash([]);
}

function startLassoAnim() {
  if (S.lAnimId) cancelAnimationFrame(S.lAnimId);
  function step() {
    S.lOff = (S.lOff + 0.5) % 9;
    drawLassoSel();
    S.lAnimId = requestAnimationFrame(step);
  }
  S.lAnimId = requestAnimationFrame(step);
}

// ── CROP MODE & PRESET ────────────────────────────────────────
function setCropMode(m) {
  S.cropMode = m;
  document.getElementById('btn-rect').style.background  = m==='rect'  ? '#E9D5FF' : 'white';
  document.getElementById('btn-lasso').style.background = m==='lasso' ? '#E9D5FF' : 'white';
  clearSel();
  if (m === 'lasso') startLassoAnim();
  else if (S.lAnimId) { cancelAnimationFrame(S.lAnimId); S.lAnimId = null; }
}

function preset(zone) {
  if (!S.src) { toast('이미지를 먼저 불러오세요!'); return; }
  var c = document.getElementById('crop-sel-c');
  var w = c.width, h = c.height;
  setCropMode('rect');
  var map = {top:{x:0,y:0,w:w,h:h/3}, mid:{x:0,y:h/3,w:w,h:h/3}, bot:{x:0,y:h*2/3,w:w,h:h/3}, all:{x:0,y:0,w:w,h:h}};
  var p = map[zone];
  S.rStart = {x:p.x, y:p.y}; S.rEnd = {x:p.x+p.w, y:p.y+p.h};
  drawRectSel();
}

// ── NUKKII ────────────────────────────────────────────────────
function toggleNukkii(on) {
  S.nukkii = on;
  document.getElementById('nukkii-track').style.background = on ? '#A855F7' : '#D1D5DB';
  document.getElementById('nukkii-knob').style.left = on ? '21px' : '1px';
}

// ── ADD TO POCKET ─────────────────────────────────────────────
function addToPocket() {
  if (!S.src) { toast('이미지를 먼저 불러오세요!'); return; }
  var cc;

  if (S.cropMode === 'rect' && S.rStart && S.rEnd) {
    var sc = S.cropScale;
    var x1 = Math.min(S.rStart.x, S.rEnd.x)/sc, y1 = Math.min(S.rStart.y, S.rEnd.y)/sc;
    var cw2 = Math.abs(S.rEnd.x - S.rStart.x)/sc, ch2 = Math.abs(S.rEnd.y - S.rStart.y)/sc;
    if (cw2 < 4 || ch2 < 4) { toast('영역을 선택하세요!'); return; }
    cc = document.createElement('canvas');
    cc.width = Math.round(cw2); cc.height = Math.round(ch2);
    cc.getContext('2d').drawImage(S.src, x1, y1, cw2, ch2, 0, 0, cw2, ch2);

  } else if (S.cropMode === 'lasso' && S.lPts.length > 5) {
    var sc = S.cropScale;
    var pts = S.lPts.map(function(p){ return {x:p.x/sc, y:p.y/sc}; });
    var xs = pts.map(function(p){return p.x;}), ys = pts.map(function(p){return p.y;});
    var mx = Math.max(0, Math.min.apply(null,xs)), my = Math.max(0, Math.min.apply(null,ys));
    var Mx = Math.min(S.src.width, Math.max.apply(null,xs)), My = Math.min(S.src.height, Math.max.apply(null,ys));
    var lw = Mx-mx, lh = My-my;
    if (lw < 4 || lh < 4) { toast('영역을 선택하세요!'); return; }
    cc = document.createElement('canvas');
    cc.width = Math.round(lw); cc.height = Math.round(lh);
    var ctx2 = cc.getContext('2d');
    ctx2.beginPath();
    ctx2.moveTo(pts[0].x-mx, pts[0].y-my);
    pts.forEach(function(p){ ctx2.lineTo(p.x-mx, p.y-my); });
    ctx2.closePath(); ctx2.clip();
    ctx2.drawImage(S.src, mx, my, lw, lh, 0, 0, lw, lh);

  } else {
    cc = document.createElement('canvas');
    cc.width = S.src.width; cc.height = S.src.height;
    cc.getContext('2d').drawImage(S.src, 0, 0);
  }

  if (S.nukkii) cc = applyNukkii(cc);

  var id = S.pNextId++;
  S.pocket.push({id:id, canvas:cc, name:'스티커'+(id+1)});
  renderPocket();
  toast('스티커 추가됨!');
}

function applyNukkii(src) {
  var dst = document.createElement('canvas');
  dst.width = src.width; dst.height = src.height;
  var ctx = dst.getContext('2d'); ctx.drawImage(src, 0, 0);
  var id = ctx.getImageData(0,0,dst.width,dst.height), d = id.data;
  for (var i=0; i<d.length; i+=4) {
    if (d[i]>228 && d[i+1]>228 && d[i+2]>228) d[i+3]=0;
  }
  ctx.putImageData(id, 0, 0); return dst;
}

// ── POCKET RENDER ─────────────────────────────────────────────
function renderPocket() {
  var grid = document.getElementById('pocket-grid');
  var emp  = document.getElementById('pocket-empty');
  Array.from(grid.children).forEach(function(el){ if (el !== emp) el.remove(); });
  if (!S.pocket.length) { emp.style.display = ''; return; }
  emp.style.display = 'none';

  S.pocket.forEach(function(item, idx) {
    var wrap = document.createElement('div');
    wrap.className = 'pocket-item';
    wrap.draggable = true;
    wrap.title = item.name;
    wrap.style.width = '100%';

    var inner = document.createElement('div');
    inner.style.cssText = 'display:flex; align-items:center; gap:6px;';

    var thumb = document.createElement('canvas');
    thumb.width = 52; thumb.height = 52;
    var tc = thumb.getContext('2d');
    var ts = Math.min(52/item.canvas.width, 52/item.canvas.height);
    var tw = item.canvas.width*ts, tH = item.canvas.height*ts;
    tc.drawImage(item.canvas, (52-tw)/2, (52-tH)/2, tw, tH);
    inner.appendChild(thumb);

    var info = document.createElement('div');
    info.style.cssText = 'flex:1; min-width:0;';
    info.innerHTML = '<div style="font-size:10px;font-weight:800;color:#4A3E3D;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+item.name+'</div>'
      +'<div style="font-size:10px;color:#7C6F64;cursor:pointer;" onclick="dlSticker(S.pocket['+idx+'])">⬇️ 저장</div>';
    inner.appendChild(info);
    wrap.appendChild(inner);

    var x = document.createElement('div');
    x.className = 'x-btn'; x.textContent = '×';
    x.onclick = function(e){ e.stopPropagation(); rmPocket(item.id); };
    wrap.appendChild(x);

    wrap.addEventListener('dragstart', function(e){
      S.pDragIdx = idx;
      e.dataTransfer.setData('text/plain', String(idx));
      e.dataTransfer.effectAllowed = 'copy';
    });

    grid.appendChild(wrap);
  });
}

function rmPocket(id) {
  S.pocket = S.pocket.filter(function(p){ return p.id !== id; });
  renderPocket();
}
function dlSticker(item) {
  var a = document.createElement('a');
  a.href = item.canvas.toDataURL('image/png');
  a.download = item.name+'.png'; a.click();
}
function dlAll() {
  if (!S.pocket.length) { toast('스티커가 없어요!'); return; }
  S.pocket.forEach(dlSticker);
}

// ── GOODS CANVAS ──────────────────────────────────────────────
function setupGoodsCanvas() {
  var c = document.getElementById('goods-c');

  c.addEventListener('dragover', function(e){ e.preventDefault(); });
  c.addEventListener('drop', function(e){
    e.preventDefault();
    if (S.pDragIdx == null || S.pDragIdx >= S.pocket.length) return;
    var item = S.pocket[S.pDragIdx];
    var pos = gPos(e);
    var st = {id:S.sNextId++, img:item.canvas, cx:pos.x, cy:pos.y, scale:40};
    S.stickers.push(st);
    S.selId = st.id;
    showCtrl(st.scale);
    renderGoods(); updCount();
    S.pDragIdx = null;
    toast('스티커 배치!');
  });

  c.addEventListener('mousedown', gDown);
  c.addEventListener('mousemove', gMove);
  c.addEventListener('mouseup',   function(){ S.gDrag=false; });
  c.addEventListener('mouseleave',function(){ S.gDrag=false; });
  c.addEventListener('touchstart', function(e){ e.preventDefault(); gDown(t2m(e)); }, {passive:false});
  c.addEventListener('touchmove',  function(e){ e.preventDefault(); gMove(t2m(e)); }, {passive:false});
  c.addEventListener('touchend',   function(e){ e.preventDefault(); S.gDrag=false; }, {passive:false});
}

function gPos(e) {
  var c = document.getElementById('goods-c');
  var r = c.getBoundingClientRect();
  var cfg = PROD[S.prod];
  return {
    x: (e.clientX - r.left) * (cfg.cw / r.width),
    y: (e.clientY - r.top)  * (cfg.ch / r.height),
  };
}

function gDown(e) {
  var pos = gPos(e);
  var cfg = PROD[S.prod];
  var found = null;
  for (var i = S.stickers.length-1; i >= 0; i--) {
    var st = S.stickers[i];
    var sz = (st.scale/100) * Math.min(cfg.cw, cfg.ch);
    if (pos.x >= st.cx-sz/2 && pos.x <= st.cx+sz/2 &&
        pos.y >= st.cy-sz/2 && pos.y <= st.cy+sz/2) { found=st; break; }
  }
  if (found) {
    S.selId=found.id; S.gDrag=true; S.gDragId=found.id;
    S.gDx=pos.x-found.cx; S.gDy=pos.y-found.cy;
    showCtrl(found.scale);
  } else {
    S.selId=null; hideCtrl();
  }
  renderGoods();
}

function gMove(e) {
  if (!S.gDrag) return;
  var pos = gPos(e);
  var st = S.stickers.find(function(s){ return s.id===S.gDragId; });
  if (!st) return;
  st.cx = pos.x - S.gDx;
  st.cy = pos.y - S.gDy;
  renderGoods();
}

function showCtrl(scale) {
  var el = document.getElementById('st-ctrl');
  el.style.display = 'flex';
  document.getElementById('sz-slider').value = scale;
}
function hideCtrl() { document.getElementById('st-ctrl').style.display = 'none'; }
function resizeSt(v) {
  var st = S.stickers.find(function(s){ return s.id===S.selId; });
  if (st) { st.scale = parseInt(v); renderGoods(); }
}
function deleteSt() {
  S.stickers = S.stickers.filter(function(s){ return s.id!==S.selId; });
  S.selId=null; hideCtrl(); renderGoods(); updCount();
}
function clearAll() {
  S.stickers=[]; S.selId=null; hideCtrl(); renderGoods(); updCount(); toast('전체 삭제!');
}
function updCount() { document.getElementById('st-count').textContent = S.stickers.length+'개'; }

// ── GOODS RENDER ──────────────────────────────────────────────
function renderGoods() {
  var c = document.getElementById('goods-c');
  var cfg = PROD[S.prod];
  var wrap = document.getElementById('goods-wrap');
  var mw = wrap.clientWidth - 4, mh = wrap.clientHeight - 4;
  if (mw <= 0) mw = 300; if (mh <= 0) mh = 300;
  var ds = Math.min(mw/cfg.cw, mh/cfg.ch, 2);
  c.style.width  = Math.round(cfg.cw*ds)+'px';
  c.style.height = Math.round(cfg.ch*ds)+'px';
  c.width = cfg.cw; c.height = cfg.ch;

  var ctx = c.getContext('2d');
  ctx.clearRect(0,0,cfg.cw,cfg.ch);
  drawShape(ctx, S.prod, cfg, S.color);

  S.stickers.forEach(function(st) {
    if (!st.img) return;
    var sz = (st.scale/100)*Math.min(cfg.cw,cfg.ch);
    ctx.save();
    ctx.translate(st.cx, st.cy);
    ctx.drawImage(st.img, -sz/2, -sz/2, sz, sz);
    if (S.selId===st.id) {
      ctx.strokeStyle='#C084FC'; ctx.lineWidth=2; ctx.setLineDash([3,2]);
      ctx.strokeRect(-sz/2-3, -sz/2-3, sz+6, sz+6); ctx.setLineDash([]);
      ctx.fillStyle='#A855F7';
      [[-sz/2-3,-sz/2-3],[sz/2+3,-sz/2-3],[-sz/2-3,sz/2+3],[sz/2+3,sz/2+3]].forEach(function(h){
        ctx.fillRect(h[0]-3, h[1]-3, 6, 6);
      });
    }
    ctx.restore();
  });

  if (S.showGuide) drawGuides(ctx, cfg);
}

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function adjBri(hex, d) {
  var n = parseInt(hex.replace('#',''),16);
  var r = Math.min(255,Math.max(0,(n>>16)+d));
  var g = Math.min(255,Math.max(0,((n>>8)&255)+d));
  var b = Math.min(255,Math.max(0,(n&255)+d));
  return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
}

function drawShape(ctx, type, cfg, color) {
  var cw=cfg.cw, ch=cfg.ch, ax=cfg.ax, ay=cfg.ay, aw=cfg.aw, ah=cfg.ah;
  ctx.save();

  if (type==='phone') {
    rr(ctx,5,5,cw-10,ch-10,22);
    ctx.fillStyle=color; ctx.fill();
    ctx.strokeStyle='#4A3E3D'; ctx.lineWidth=2; ctx.stroke();
    rr(ctx,ax,ay,aw,ah,8);
    ctx.fillStyle='rgba(200,230,255,.35)'; ctx.fill();
    ctx.strokeStyle='#9CA3AF'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.arc(cw/2,ay-14,7,0,Math.PI*2);
    ctx.fillStyle='#4A3E3D'; ctx.fill();
    rr(ctx,cw/2-18,ay-26,36,5,3);
    ctx.fillStyle='#4A3E3D'; ctx.fill();

  } else if (type==='griptok') {
    var R = Math.min(cw,ch)/2-5;
    ctx.beginPath(); ctx.arc(cw/2,ch/2,R,0,Math.PI*2);
    ctx.fillStyle=color; ctx.fill();
    ctx.strokeStyle='#4A3E3D'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(cw/2,ch/2,aw/2,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.3)'; ctx.fill();
    ctx.strokeStyle='#9CA3AF'; ctx.lineWidth=1; ctx.stroke();

  } else if (type==='mug') {
    ctx.beginPath();
    ctx.moveTo(ax,ay); ctx.lineTo(ax+18,ay+ah+28); ctx.lineTo(ax+aw-18,ay+ah+28); ctx.lineTo(ax+aw,ay);
    ctx.closePath(); ctx.fillStyle=color; ctx.fill();
    ctx.strokeStyle='#4A3E3D'; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.arc(ax+aw+18,ay+ah/2,28,-Math.PI/2,Math.PI/2);
    ctx.strokeStyle='#4A3E3D'; ctx.lineWidth=10; ctx.stroke();
    ctx.strokeStyle=color; ctx.lineWidth=6; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(ax+aw/2,ay,aw/2,9,0,0,Math.PI*2);
    ctx.fillStyle=adjBri(color,-25); ctx.fill();
    ctx.strokeStyle='#4A3E3D'; ctx.lineWidth=1.5; ctx.stroke();

  } else if (type==='keyring') {
    ctx.beginPath(); ctx.arc(cw/2,22,15,0,Math.PI*2);
    ctx.strokeStyle='#4A3E3D'; ctx.lineWidth=4; ctx.stroke();
    ctx.strokeStyle='#C4B5A0'; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cw/2,37); ctx.lineTo(cw/2,ay-2);
    ctx.strokeStyle='#9CA3AF'; ctx.lineWidth=2; ctx.setLineDash([3,2]); ctx.stroke(); ctx.setLineDash([]);
    rr(ctx,ax,ay,aw,ah,14);
    ctx.globalAlpha=0.88; ctx.fillStyle=color; ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle='#4A3E3D'; ctx.lineWidth=2; ctx.stroke();
    rr(ctx,ax+8,ay+8,aw/3,ah/3,6);
    ctx.fillStyle='rgba(255,255,255,.45)'; ctx.fill();

  } else if (type==='tshirt') {
    var cx=cw/2;
    ctx.beginPath();
    ctx.moveTo(cx-68,22); ctx.lineTo(cx-88,12); ctx.lineTo(cx-108,50); ctx.lineTo(cx-74,64);
    ctx.lineTo(cx-74,ch-18); ctx.lineTo(cx+74,ch-18); ctx.lineTo(cx+74,64);
    ctx.lineTo(cx+108,50); ctx.lineTo(cx+88,12); ctx.lineTo(cx+68,22);
    ctx.quadraticCurveTo(cx+28,44,cx,47);
    ctx.quadraticCurveTo(cx-28,44,cx-68,22);
    ctx.closePath();
    ctx.fillStyle=color; ctx.fill();
    ctx.strokeStyle='#4A3E3D'; ctx.lineWidth=2; ctx.stroke();
  }

  ctx.restore();
}

function drawGuides(ctx, cfg) {
  var ax=cfg.ax,ay=cfg.ay,aw=cfg.aw,ah=cfg.ah;
  ctx.save();
  // bleed
  ctx.strokeStyle='rgba(239,68,68,.75)'; ctx.lineWidth=1;
  ctx.setLineDash([4,2]); ctx.strokeRect(ax-4,ay-4,aw+8,ah+8); ctx.setLineDash([]);
  // safe
  ctx.strokeStyle='rgba(59,130,246,.75)';
  ctx.setLineDash([4,2]); ctx.strokeRect(ax+6,ay+6,aw-12,ah-12); ctx.setLineDash([]);
  ctx.font='8px Nunito';
  ctx.fillStyle='rgba(239,68,68,.85)'; ctx.fillText('재단선',ax-3,ay-7);
  ctx.fillStyle='rgba(59,130,246,.85)'; ctx.fillText('안전선',ax+8,ay+18);
  if (cfg.hole) {
    ctx.strokeStyle='rgba(239,68,68,.75)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cfg.cw/2,ay-14,8,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(239,68,68,.85)'; ctx.fillText('고리홀',cfg.cw/2-10,ay-25);
  }
  ctx.restore();
}

// ── PRODUCT SELECT ────────────────────────────────────────────
function selProd(type) {
  S.prod=type; S.stickers=[]; S.selId=null; hideCtrl(); updCount();
  Object.keys(PROD).forEach(function(t){
    var tab = document.getElementById('tab-'+t);
    if (tab) tab.className = 'prod-tab'+(t===type?' on':'');
  });
  renderGoods();
  toast(PROD[type].name+' 선택!');
}

// ── COLOR / GUIDE ─────────────────────────────────────────────
function setColor(c) {
  S.color=c;
  document.getElementById('custom-col').value=c;
  renderGoods();
}

function toggleGuide(on) {
  S.showGuide=on;
  document.getElementById('guide-track').style.background = on ? '#86EFAC' : '#D1D5DB';
  document.getElementById('guide-knob').style.left = on ? '21px' : '1px';
  renderGoods();
}

// ── EXPORT ────────────────────────────────────────────────────
function exportPNG() {
  var c = document.getElementById('goods-c');
  var prev=S.selId, prevG=S.showGuide;
  S.selId=null; S.showGuide=false; renderGoods();
  var a=document.createElement('a');
  a.href=c.toDataURL('image/png');
  a.download=PROD[S.prod].name+'_굿즈.png'; a.click();
  S.selId=prev; S.showGuide=prevG; renderGoods();
  toast('PNG 저장!');
}

// ── RESIZE ────────────────────────────────────────────────────
window.addEventListener('resize', function(){
  if (S.src) drawCropImg();
  renderGoods();
});

window.addEventListener('load', init);
</script>
