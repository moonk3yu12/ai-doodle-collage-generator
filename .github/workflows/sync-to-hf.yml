name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push code to HF (binary files excluded)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: moonLeek
          HF_SPACE: Character_Design_Request
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote add hf https://$HF_USER:$HF_TOKEN@huggingface.co/spaces/$HF_USER/$HF_SPACE
          git checkout -b hf-deploy
          git rm -r --cached styles/ 2>/dev/null || true
          git commit --allow-empty -m "chore: deploy without binary assets"
          git push --force hf hf-deploy:main

      - name: Upload style images via HF Hub API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python - <<'EOF'
          import os, glob
          from huggingface_hub import HfApi
          api = HfApi()
          files = sorted(
              glob.glob("styles/*.png") +
              glob.glob("styles/*.jpg") +
              glob.glob("styles/*.jpeg")
          )
          for path in files:
              print(f"  uploading {path}")
              api.upload_file(
                  path_or_fileobj=path,
                  path_in_repo=path,
                  repo_id="moonLeek/Character_Design_Request",
                  repo_type="space",
                  token=os.environ["HF_TOKEN"],
              )
          print(f"Done — {len(files)} file(s) uploaded.")
          EOF
