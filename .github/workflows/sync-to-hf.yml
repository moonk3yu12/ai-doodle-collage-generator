name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push code to HF (binary files excluded)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: moonLeek
          HF_SPACE: Character_Design_Request
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote add hf https://$HF_USER:$HF_TOKEN@huggingface.co/spaces/$HF_USER/$HF_SPACE
          git checkout --orphan hf-deploy
          git rm --cached -rf styles/ 2>/dev/null || true
          git rm --cached -rf test/ 2>/dev/null || true
          git commit -m "chore: deploy snapshot (no binary assets)"
          git push --force hf hf-deploy:main

      - name: Upload binary assets via HF Hub API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python - <<'EOF'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          api = HfApi()
          repo_id = "moonLeek/Character_Design_Request"
          token = os.environ["HF_TOKEN"]
          for folder in ("styles", "test"):
              if Path(folder).exists():
                  print(f"  uploading {folder}/...")
                  api.upload_folder(
                      folder_path=folder,
                      path_in_repo=folder,
                      repo_id=repo_id,
                      repo_type="space",
                      token=token,
                  )
                  print(f"  done — {folder}/")
          print("All assets uploaded.")
          EOF
