name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

    
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: moonk3yu12         # ⚠️ 여기를 leemoonkyu에서 본인의 진짜 HF 아이디로 바꿨습니다!
          HF_SPACE: Character_Design_Request    # 1단계에서 만든 Space 이름이 맞는지 확인하세요!
        run: |
          git remote add hf https://$HF_USER:$HF_TOKEN@huggingface.co/spaces/$HF_USER/$HF_SPACE
          git push --force hf main